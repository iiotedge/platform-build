name: Release BOM & Parent to GitHub Packages

on:
  push:
    tags: ['20*.*.*', '2025.*', 'v20*.*.*', 'v2025.*']       # e.g., 2025.08.16 or v2025.08.16
  workflow_dispatch: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      GH_REPO: ${{ github.repository }}             # e.g., iiotedge/platform-build
      HAS_PAT: ${{ secrets.GH_PACKAGES_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21 (and Maven cache)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          # we’ll pass our own settings.xml to mvn (-s), so these server-* are not relied on
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: ${{ secrets.GITHUB_TOKEN }}

      # Write a clean settings.xml and use it for ALL mvn runs (-s).
      - name: Write clean Maven settings for GitHub Packages
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SETTINGS="$RUNNER_TEMP/gpr-settings.xml"
          cat > "$SETTINGS" <<XML
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/${{ env.GH_REPO }}</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>github-plugins</id>
                    <url>https://maven.pkg.github.com/${{ env.GH_REPO }}</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          XML
          echo "GPR_SETTINGS=$SETTINGS" >> "$GITHUB_ENV"

      - name: Install XML tools (for version alignment)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils xmlstarlet

      # Align BOM's own version with the tag (only on tag builds). Split from
      # aligning the parent (below) because of a load-bearing ordering
      # constraint, confirmed the hard way: `mvn versions:set -f
      # iiotedge-parent/pom.xml` has to build the parent's full effective
      # model just to change its own <version> tag, which means resolving
      # its <dependencyManagement> import of iiotedge-bom - using whatever
      # version that import currently says. That import can only resolve
      # once the BOM has actually been installed under the version it's
      # about to be repointed to, which is why "Install BOM locally" sits
      # between this step and "Align Parent version with tag" rather than
      # after both.
      - name: Align BOM version with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF##*/}"
          TAG="${TAG#v}"   # strip a leading 'v' so v2025.08.18 and 2025.08.18 publish under the same version
          echo "Tag is: ${TAG}"

          BOM_POM="iiotedge-bom/pom.xml"

          # Maven POMs declare a default XML namespace (xmlns="http://maven.apache.org/POM/4.0.0"),
          # so a plain /project/version xpath silently matches nothing and
          # returns an empty string instead of erroring - confirmed the hard
          # way (this exact bug shipped once already, in the sibling
          # snapshot-parent.yml workflow). local-name() sidesteps it.
          BOM_VER=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='version'])" "$BOM_POM")
          if [[ "$BOM_VER" != "$TAG" ]]; then
            mvn -q -N -f "$BOM_POM" versions:set -DnewVersion="$TAG" -DgenerateBackupPoms=false
          fi

      # ---- Critical: install the BOM locally BEFORE anything that imports it ----
      - name: Install BOM locally
        run: mvn -B -s "$GPR_SETTINGS" -DskipTests -Dstyle.color=always -f iiotedge-bom/pom.xml clean install

      # Now that the (possibly just-retagged) BOM is installed locally under
      # its final version, it's safe to repoint the parent's import and set
      # the parent's own version - both can now actually resolve.
      - name: Align Parent version with tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF##*/}"
          TAG="${TAG#v}"
          echo "Tag is: ${TAG}"

          BOM_POM="iiotedge-bom/pom.xml"
          PARENT_POM="iiotedge-parent/pom.xml"

          PARENT_VER=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='version'])" "$PARENT_POM")
          IMPORT_VER=$(xmllint --xpath "string(//*[local-name()='dependency'][*[local-name()='artifactId']='iiotedge-bom']/*[local-name()='version'])" "$PARENT_POM")

          if [[ "$IMPORT_VER" != "$TAG" ]]; then
            # xmlstarlet needs the namespace registered too (-N), for the same reason as xmllint above.
            xmlstarlet ed -P -L -N x="http://maven.apache.org/POM/4.0.0" \
              -u "//x:dependency[x:artifactId='iiotedge-bom']/x:version" -v "$TAG" \
              "$PARENT_POM"
          fi
          if [[ "$PARENT_VER" != "$TAG" ]]; then
            mvn -q -N -f "$PARENT_POM" versions:set -DnewVersion="$TAG" -DgenerateBackupPoms=false
          fi

          # Plain bash echo, not an embedded newline inside the xpath string -
          # XPath string literals don't interpret \n or &#10; as an actual
          # newline (confirmed: both print as literal text), so building the
          # separator that way silently ran every value together on one line.
          echo "Post-update check:"
          echo "BOM=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='version'])" "$BOM_POM")"
          echo "PARENT=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='version'])" "$PARENT_POM")"
          echo "IMPORT=$(xmllint --xpath "string(//*[local-name()='dependency'][*[local-name()='artifactId']='iiotedge-bom']/*[local-name()='version'])" "$PARENT_POM")"

      # Tag: deploy to GH Packages; Branch: just verify
      - name: Build/Publish BOM
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            mvn -B -s "$GPR_SETTINGS" -DskipTests -Dstyle.color=always \
                -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GH_REPO} \
                -DdeployAtEnd=false -Dmaven.deploy.skip=false \
                -f iiotedge-bom/pom.xml \
                org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy
          else
            mvn -B -s "$GPR_SETTINGS" -DskipTests -Dstyle.color=always \
                -f iiotedge-bom/pom.xml verify
          fi

      - name: Build/Publish Parent
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            mvn -B -s "$GPR_SETTINGS" -DskipTests -Dstyle.color=always \
                -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GH_REPO} \
                -DdeployAtEnd=false -Dmaven.deploy.skip=false \
                -f iiotedge-parent/pom.xml \
                clean org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy
          else
            mvn -B -s "$GPR_SETTINGS" -DskipTests -Dstyle.color=always \
                -f iiotedge-parent/pom.xml clean verify
          fi

      # Optional fallback if org policy blocks GITHUB_TOKEN for packages
      - name: Retry with PAT fallback
        if: ${{ failure() && env.HAS_PAT == 'true' }}
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_PAT: ${{ secrets.GH_PACKAGES_TOKEN }}
        run: |
          echo "FALLBACK: retrying deploy with PAT…"
          SETTINGS="$RUNNER_TEMP/gpr-settings-pat.xml"
          cat > "$SETTINGS" <<XML
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_PAT}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/${{ env.GH_REPO }}</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>github-plugins</id>
                    <url>https://maven.pkg.github.com/${{ env.GH_REPO }}</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          XML

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            mvn -B -s "$SETTINGS" -DskipTests -Dstyle.color=always \
                -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GH_REPO} \
                -f iiotedge-bom/pom.xml \
                org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy

            mvn -B -s "$SETTINGS" -DskipTests -Dstyle.color=always \
                -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GH_REPO} \
                -f iiotedge-parent/pom.xml \
                org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy
          else
            echo "Branch build failed earlier; PAT fallback only applies to tag publishes. Skipping."
          fi

