name: Reusable Container Build
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string

jobs:
  container:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: 'maven'
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Paketo's <publish>true</publish> (set in iiotedge-parent) pushes the
      # image directly as part of this goal - no separate docker tag/push
      # needed. Overriding the image name here (rather than relying on the
      # pom's ${project.artifactId}:${project.version} default) lets the
      # caller control the exact tag; the previous version of this step
      # tagged/pushed a ref (${GITHUB_REF_NAME}) that Paketo never actually
      # built, which would have failed with "No such image".
      - name: Build & Publish OCI image with Spring Boot (Paketo)
        run: |
          mvn -B -DskipTests \
              -Dspring-boot.build-image.imageName=ghcr.io/iiotedge/${{ inputs.image_name }}:${{ github.sha }} \
              spring-boot:build-image
