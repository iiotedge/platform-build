name: Snapshot Deploy (BOM & Parent to GitHub Packages)

on:
  push:
    branches: [ main ]    # every push to main publishes SNAPSHOT
  workflow_dispatch: {}

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Java 21 (and Maven cache)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Write clean Maven settings for GitHub Packages
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SETTINGS="$RUNNER_TEMP/gpr-settings.xml"
          cat > "$SETTINGS" <<XML
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github</id>
                <username>${GH_ACTOR}</username>
                <password>${GH_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/${{ env.GH_REPO }}</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>github-plugins</id>
                    <url>https://maven.pkg.github.com/${{ env.GH_REPO }}</url>
                    <releases><enabled>true</enabled></releases>
                    <snapshots><enabled>true</enabled></snapshots>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          XML
          echo "GPR_SETTINGS=$SETTINGS" >> "$GITHUB_ENV"

      - name: Install XML tools (for version alignment)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libxml2-utils xmlstarlet

      # The checked-in <version> isn't -SNAPSHOT suffixed, so without this,
      # every push to main would redeploy under that same fixed version -
      # most registries (including GitHub Packages) treat a non-SNAPSHOT
      # version as immutable once published, so repeat pushes would fail or
      # silently overwrite. Force a real SNAPSHOT version instead, same way
      # release-parent.yml forces a real release version from the tag.
      #
      # Ordering here is load-bearing, confirmed the hard way: `mvn
      # versions:set -f iiotedge-parent/pom.xml` has to build the parent's
      # full effective model just to change its own <version> tag, which
      # means resolving its <dependencyManagement> import of iiotedge-bom -
      # using whatever version that import currently says. If the import
      # still points at the OLD version (because BOM hasn't been re-pointed
      # yet) and that old version was never published/installed, this fails
      # with "Non-resolvable import POM" before it ever gets to set anything.
      # So: version + install BOM, THEN repoint the import, THEN touch the
      # parent's own version - never the other way around.
      - name: Force a -SNAPSHOT version
        run: |
          BOM_POM="iiotedge-bom/pom.xml"
          PARENT_POM="iiotedge-parent/pom.xml"

          # Maven POMs declare a default XML namespace (xmlns="http://maven.apache.org/POM/4.0.0"),
          # so a plain /project/version xpath silently matches nothing and
          # returns an empty string - confirmed the hard way (this exact
          # bug shipped once already). local-name() sidesteps the namespace.
          BOM_VER=$(xmllint --xpath "string(/*[local-name()='project']/*[local-name()='version'])" "$BOM_POM")
          SNAPSHOT_VER="${BOM_VER%-SNAPSHOT}-SNAPSHOT"

          mvn -q -N -f "$BOM_POM" versions:set -DnewVersion="$SNAPSHOT_VER" -DgenerateBackupPoms=false
          mvn -B -s "$GPR_SETTINGS" -DskipTests -f "$BOM_POM" clean install

          # xmlstarlet needs the namespace registered too (-N), for the same reason as xmllint above.
          xmlstarlet ed -P -L -N x="http://maven.apache.org/POM/4.0.0" \
            -u "//x:dependency[x:artifactId='iiotedge-bom']/x:version" -v "$SNAPSHOT_VER" \
            "$PARENT_POM"
          mvn -q -N -f "$PARENT_POM" versions:set -DnewVersion="$SNAPSHOT_VER" -DgenerateBackupPoms=false

          echo "Snapshot version: $SNAPSHOT_VER"

      - name: Deploy BOM (SNAPSHOT)
        run: |
          mvn -B -s "$GPR_SETTINGS" -DskipTests -Dstyle.color=always \
              "-DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GH_REPO}" \
              -f iiotedge-bom/pom.xml \
              org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy

      - name: Deploy Parent (SNAPSHOT)
        run: |
          mvn -B -s "$GPR_SETTINGS" -DskipTests -Dstyle.color=always \
              "-DaltDeploymentRepository=github::default::https://maven.pkg.github.com/${GH_REPO}" \
              -f iiotedge-parent/pom.xml \
              org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy
